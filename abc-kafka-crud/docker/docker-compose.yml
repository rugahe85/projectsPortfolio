services:
  # ── PostgreSQL 16 ──
  postgres:
    image: postgres:16-alpine
    container_name: abc-postgres
    environment:
      POSTGRES_DB: abc_crud_db
      POSTGRES_USER: abc_user
      POSTGRES_PASSWORD: abc_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - abc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abc_user -d abc_crud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: abc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - abc-network

  # ── Apache Kafka ──
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: abc-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - abc-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Kafka UI ──
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: abc-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: abc-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - abc-network

volumes:
  postgres_data:

networks:
  abc-network:
    driver: bridge
